<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>出餐倒數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111417;
    --panel:#191D22;
    --card:#1E242B;
    --line:#2C343D;
    --txt:#EDF1F4;
    --dim:#8B98A5;
    --go:#4ADE80;
    --soon:#FBBF24;
    --ring:#FF4438;
    --pad:16px;
    --num:"Oswald","Helvetica Neue",Arial,sans-serif;
    --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--ui)}
  body{
    padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 32px);
    max-width:720px;margin:0 auto;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  :focus-visible{outline:2px solid var(--go);outline-offset:2px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--bg) 78%,rgba(17,20,23,0));
    padding:calc(env(safe-area-inset-top) + 14px) 0 12px;
    display:flex;align-items:baseline;gap:10px;
  }
  .brand{font-size:20px;letter-spacing:.08em;color:var(--txt);font-weight:700}
  .now-label{font-size:12px;color:var(--dim);margin-left:auto}
  .now{
    font-family:var(--num);font-size:30px;font-weight:500;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1;
  }
  .now small{font-size:17px;color:var(--dim)}

  /* ---------- add panel ---------- */
  .panel{
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px;
  }
  .panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .panel-title{font-size:20px;font-weight:700}
  .panel-hint{font-size:12px;color:var(--dim)}
  .test{
    font-size:12px;color:var(--dim);border:1px solid var(--line);
    padding:5px 10px;border-radius:999px;
  }
  .test:active{background:var(--card)}
  .tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
  .test.on{color:var(--go);border-color:rgba(74,222,128,.45)}
  .warn{
    margin-top:10px;background:#2A2118;border:1px solid #4A3A20;color:#E4C88A;
    border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.6;display:none;
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .min{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 4px 9px;text-align:center;transition:transform .08s,background .12s;
  }
  .min:active{transform:scale(.955);background:#28313A}
  .min b{
    display:block;font-family:var(--num);font-weight:500;font-size:31px;
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .min b i{font-size:12px;font-style:normal;color:var(--dim);margin-left:2px;font-family:var(--ui)}
  .min span{display:block;margin-top:5px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* ---------- list ---------- */
  .bar{
    display:flex;align-items:center;gap:8px;
    margin:22px 2px 10px;font-size:12.5px;color:var(--dim);
  }
  .bar::after{content:"";flex:1;height:1px;background:var(--line)}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}

  .tk{
    position:relative;background:var(--card);border-radius:4px 4px 12px 12px;
    padding:16px 12px 13px;border:1px solid var(--line);border-top:0;
    overflow:hidden;text-align:left;width:100%;display:block;
  }
  /* 撕紙齒孔 */
  .tk::before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background-image:radial-gradient(circle 5px at 8px 0, var(--bg) 5px, transparent 5.5px);
    background-size:16px 7px;background-repeat:repeat-x;
  }
  .tk-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .tk-no{
    width:19px;height:19px;flex:none;border-radius:50%;border:1px solid var(--dim);
    color:var(--dim);font-size:11px;line-height:17px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .tk-when{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .tk-when em{font-style:normal;color:var(--dim);font-weight:400;font-size:11.5px;margin-left:2px}
  .tk-plus{margin-left:auto;font-size:11px;color:var(--dim)}
  .tk-time{
    font-family:var(--num);font-weight:500;font-size:46px;line-height:.98;
    font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--go);
  }
  .tk-state{margin-top:7px;font-size:11.5px;color:var(--dim);min-height:17px}
  .tk-x{
    display:block;width:100%;margin-top:11px;
    font-size:15px;font-weight:500;color:var(--dim);
    padding:10px 8px;border-radius:9px;border:1px solid var(--line);line-height:1.2;
    text-align:center;
  }
  .tk-x:active{background:#28313A}
  .tk-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);display:none}
  .tk-bar i{display:block;height:100%;background:#fff;width:100%}

  .is-soon .tk-time{color:var(--soon)}
  .is-soon .tk-state{color:var(--soon)}

  .is-ring{background:var(--ring);border-color:var(--ring);animation:flash 1s steps(1,end) infinite}
  .is-ring .tk-time,.is-ring .tk-when,.is-ring .tk-state,.is-ring .tk-plus{color:#fff}
  .is-ring .tk-state{font-weight:700}
  .is-ring .tk-no{border-color:rgba(255,255,255,.7);color:#fff}
  .is-ring .tk-x{visibility:hidden}
  @keyframes flash{0%{background:var(--ring)}50%{background:#8E1508}}

  .is-pending{background:#20262D;border-color:var(--line)}
  .is-pending .tk-time{color:var(--dim)}
  .is-pending .tk-bar{display:block}
  .is-pending .tk-x{visibility:hidden}
  .is-pending .tk-state{color:var(--txt)}

  .armed .tk-x{background:var(--ring);border-color:var(--ring);color:#fff}

  .empty{
    border:1px dashed var(--line);border-radius:12px;padding:26px 18px;
    text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7;
  }
  .foot{margin-top:22px;font-size:11.5px;color:#5D6975;text-align:center;line-height:1.8}

  @media (prefers-reduced-motion:reduce){
    .is-ring{animation:none}
    .min:active{transform:none}
  }
</style>
</head>
<body>

<header>
  <span class="brand">出餐倒數</span>
  <span class="now-label">現在</span>
  <span class="now" id="now">--:--<small>:--</small></span>
</header>

<section class="panel">
  <div class="panel-top">
    <div>
      <div class="panel-title">新增倒數</div>
      <div class="panel-hint">按一下分鐘數，馬上開始</div>
    </div>
    <div class="tools">
      <button class="test" id="test">試聽提示音</button>
      <button class="test" id="notify">開啟手機通知</button>
    </div>
  </div>
  <div class="grid" id="pad"></div>
  <div class="warn" id="warn"></div>
</section>

<audio id="keep" loop preload="auto" playsinline
  src="data:audio/wav;base64,UklGRmQfAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAfAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC <div class="bar" id="bar">尚無倒數</div>
<div class="list" id="list"></div>
<div class="empty" id="empty">還沒有任何倒數。<br>接到電話時，按上面的分鐘數就開始。</div>

<p class="foot">
  時間到會持續響鈴，點一下卡片停止。<br>
  停止後 5 秒內再點一次，會繼續響鈴不會消失。<br>
  倒數存在這支手機裡，重新整理或關掉網頁都不會不見。<br>
  切到別的 App 時仍會響，但手機請插電、不要讓螢幕鎖上。
</p>

<script>
(function(){
  "use strict";

  var KEY = "kitchen-countdown-v1";
  var GRACE = 5000;              // 誤觸保護視窗

  // ── 測試用開關 ──────────────────────────────
  // UNIT = 60000 → 按鈕是「分」（正式用）
  // UNIT = 1000  → 按鈕是「秒」（測試用，5 秒就會響）
  var UNIT = 60000;
  var MINUTES = [5,10,15,20,25,30];
  // ────────────────────────────────────────────

  var UNIT_LABEL = UNIT === 1000 ? "秒" : "分";
  var SOON = UNIT;               // 剩最後 1 格轉黃

  var timers = [];               // {id, endAt, mins, status, pendingUntil}
  var nodes  = new Map();
  var armed  = null;             // 刪除確認中的 id
  var armedAt = 0;
  var seq = 1;

  var $now   = document.getElementById("now");
  var $pad   = document.getElementById("pad");
  var $list  = document.getElementById("list");
  var $empty = document.getElementById("empty");
  var $bar   = document.getElementById("bar");

  /* ---------------- 工具 ---------------- */
  function pad2(n){ return (n<10?"0":"") + n; }
  function clock(ts){ var d=new Date(ts); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
  function mmss(ms){
    if(ms < 0) ms = 0;
    var s = Math.ceil(ms/1000);
    return pad2(Math.floor(s/60)) + ":" + pad2(s%60);
  }

  /* ---------------- 儲存（localStorage） ---------------- */
  var STALE = 6*60*60*1000;      // 超過 6 小時沒處理的，開店時不要再響

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({ seq:seq, timers:timers }));
    }catch(e){}                  // 無痕模式或容量滿：不存，但程式照常運作
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      seq = d.seq || 1;
      var now = Date.now();
      timers = (d.timers||[]).filter(function(t){
        if(!t || typeof t.endAt !== "number") return false;
        if(now - t.endAt > STALE) return false;                 // 隔夜的舊單直接丟掉
        if(t.status === "pending") return t.pendingUntil > now;  // 移除倒數已走完
        return true;
      });
    }catch(e){ timers = []; }
  }

  // 同一支手機開了兩個分頁時，兩邊保持一致
  window.addEventListener("storage", function(ev){
    if(ev.key !== KEY) return;
    load(); layout(); syncSound();
  });

  /* ---------------- 聲音 ---------------- */
  /*
    前景：用 setInterval 重複播放（可隨時停）
    背景：瀏覽器會凍結 JS，所以改成「事先把響鈴排進音訊時鐘」，
          音訊執行緒不受 JS 節流影響，時間到自己會響。
    保活：播一段聽不見的循環音訊，讓分頁維持「正在播放媒體」狀態，
          瀏覽器才不會把整個頁面凍結、AudioContext 才不會被暫停。
  */
  var actx = null;
  var loop = null;                 // 前景重複響鈴
  var booked = new Map();          // id -> 已排進音訊時鐘的節點
  var $keep = document.getElementById("keep");

  function audioOn(){
    try{
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) actx = new AC();
      }
      if(!actx) return Promise.resolve(false);
      if(actx.state === "suspended"){
        var p = actx.resume();
        if(p && p.then) return p.then(function(){ return true; }, function(){ return false; });
      }
      return Promise.resolve(true);
    }catch(e){ return Promise.resolve(false); }
  }

  // 無聲保活：只在有倒數時播，沒有倒數就停（才不會一直卡住店裡的音樂）
  function keepOn(){
    try{
      if(!$keep) return;
      $keep.volume = 0.02;                 // 內容本身已是全靜音，這是雙重保險
      if($keep.paused) $keep.play().catch(function(){});
    }catch(e){}
  }
  function keepOff(){
    try{ if($keep && !$keep.paused && !timers.length) $keep.pause(); }catch(e){}
  }

  function tone(at, hz, dur){
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = hz;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(.3, at + .012);
    g.gain.setValueAtTime(.3, at + dur - .03);
    g.gain.linearRampToValueAtTime(0, at + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(at); o.stop(at + dur + .03);
    return o;
  }
  function chimeAt(at){
    return [ tone(at, 988, .12), tone(at + .17, 988, .12), tone(at + .34, 1319, .26) ];
  }
  function chime(){
    if(!actx || actx.state !== "running") return;
    chimeAt(actx.currentTime + .02);
  }

  /* --- 前景 --- */
  function ringOn(){
    audioOn().then(function(ok){ if(ok) chime(); });
    if(loop) return;
    loop = setInterval(function(){
      chime();
      if(navigator.vibrate) navigator.vibrate([180,90,180]);
    }, 1300);
  }
  function ringOff(){ if(loop){ clearInterval(loop); loop = null; } }

  function syncSound(){
    if(document.hidden) return;              // 背景交給預排程，不重複發聲
    var any = timers.some(function(t){ return t.status === "ringing"; });
    if(any) ringOn(); else ringOff();
  }

  /* --- 背景：把響鈴預先排進音訊時鐘 --- */
  function book(t){
    if(!actx || actx.state !== "running") return;
    unbook(t.id);
    var lead = (t.endAt - Date.now()) / 1000;
    if(lead > 3600) return;                  // 太遠的等下次進背景再排
    var base = actx.currentTime + Math.max(lead, 0);
    var nodes = [];
    for(var i = 0; i < 40; i++){             // 約 52 秒的連續響鈴
      var at = base + i * 1.3;
      if(at < actx.currentTime) continue;
      nodes = nodes.concat(chimeAt(at));
    }
    booked.set(t.id, nodes);
  }
  function unbook(id){
    var nodes = booked.get(id);
    if(!nodes) return;
    nodes.forEach(function(o){ try{ o.stop(); o.disconnect(); }catch(e){} });
    booked.delete(id);
  }
  function bookAll(){
    audioOn().then(function(ok){
      if(!ok) return;
      timers.forEach(function(t){ if(t.status !== "pending") book(t); });
    });
  }
  function unbookAll(){ Array.from(booked.keys()).forEach(unbook); }

  /* --- 手機通知 --- */
  var $notify = document.getElementById("notify");

  function notifySupported(){ return "Notification" in window; }
  function notifyReady(){ return notifySupported() && Notification.permission === "granted"; }

  function notifyAsk(){
    if(!notifySupported()) return Promise.resolve(false);
    if(Notification.permission === "granted") return Promise.resolve(true);
    if(Notification.permission === "denied")  return Promise.resolve(false);
    try{
      return Promise.resolve(Notification.requestPermission()).then(function(p){
        return p === "granted";
      });
    }catch(e){ return Promise.resolve(false); }
  }

  function notifyFire(t){
    if(!notifyReady()) return;
    try{
      var n = new Notification("餐點時間到", {
        body: clock(t.endAt) + " 的單，該出餐了",
        tag: t.id,
        renotify: true,
        requireInteraction: true
      });
      n.onclick = function(){ try{ window.focus(); }catch(e){} n.close(); };
    }catch(e){}
  }

  function notifyPaint(){
    if(!notifySupported()){ $notify.style.display = "none"; return; }
    if(!window.isSecureContext){
      $notify.textContent = "通知需 HTTPS";
      $notify.className = "test";
      return;
    }
    if(Notification.permission === "granted"){
      $notify.textContent = "手機通知已開";
      $notify.className = "test on";
    } else if(Notification.permission === "denied"){
      $notify.textContent = "通知被封鎖・怎麼開";
      $notify.className = "test";
    } else {
      $notify.textContent = "開啟手機通知";
      $notify.className = "test";
    }
  }

  $notify.addEventListener("click", function(){
    var $w0 = document.getElementById("warn");
    if(!window.isSecureContext){
      $w0.innerHTML =
        "目前網址是 <b>http</b>（非 HTTPS，也不是 localhost），" +
        "瀏覽器規定這種情況一律停用通知與螢幕恆亮，改設定也沒用。<br>" +
        "改用下列任一種網址就會恢復：<br>" +
        "① <b>localhost</b>：chrome://inspect → Port forwarding 把手機的 5500 轉到電腦<br>" +
        "② <b>https</b>：佈署到 GitHub Pages 等有 SSL 的地方<br>" +
        "<b>響鈴不受影響</b>，時間到一樣會出聲。";
      $w0.style.display = "block";
      return;
    }
    // 已被封鎖時，requestPermission 會直接回 denied 不再跳窗 → 改成給解除步驟
    if(notifySupported() && Notification.permission === "denied"){
      var $w = document.getElementById("warn");
      $w.innerHTML =
        "通知已被瀏覽器封鎖，要手動解除：<br>" +
        "① 點網址列左邊的圖示 → 權限 → 通知 → 允許<br>" +
        "② 或 Chrome ⋮ → 設定 → 網站設定 → 通知 → 找到本站改成允許<br>" +
        "③ Android 13 以上另外確認：設定 → 應用程式 → Chrome → 通知要開啟<br>" +
        "改完請重新整理。<b>沒有通知也不影響響鈴</b>，時間到一樣會出聲。";
      $w.style.display = "block";
      return;
    }
    notifyAsk().then(function(ok){
      notifyPaint();
      if(ok) notifyFire({ id:"demo", endAt: Date.now() });
    });
  });

  /* ---------------- 螢幕保持亮著 ---------------- */
  var lock = null;
  function keepAwake(){
    try{
      if(!navigator.wakeLock || lock) return;
      navigator.wakeLock.request("screen").then(function(s){
        lock = s;
        s.addEventListener("release", function(){ lock = null; });
      }).catch(function(){});
    }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      // 要進背景了：停掉會被凍結的 JS 迴圈，改用音訊時鐘預排程
      ringOff();
      bookAll();
    } else {
      // 回到前景：撤掉預排程，由 JS 接手，並補算離開這段時間
      unbookAll();
      keepAwake();
      audioOn();
      tick();
      syncSound();
    }
  });
  window.addEventListener("pagehide", function(){ ringOff(); bookAll(); });

  /* ---------------- 新增 / 移除 ---------------- */
  function add(mins){
    audioOn(); keepAwake(); keepOn();
    timers.push({
      id: "t" + (seq++) + "_" + Date.now(),
      endAt: Date.now() + mins*UNIT,
      mins: mins,
      status: "running",
      pendingUntil: 0
    });
    layout(); save();
  }
  function remove(id){
    unbook(id);
    timers = timers.filter(function(t){ return t.id !== id; });
    layout(); save(); syncSound(); keepOff();
  }

  /* ---------------- 分鐘按鈕 ---------------- */
  MINUTES.forEach(function(m){
    var b = document.createElement("button");
    b.className = "min";
    b.type = "button";
    b.innerHTML = '<b>' + m + '<i>' + UNIT_LABEL + '</i></b><span data-m="' + m + '"></span>';
    b.setAttribute("aria-label", m + UNIT_LABEL + "後響鈴");
    b.addEventListener("click", function(){ add(m); });
    $pad.appendChild(b);
  });
  var previews = $pad.querySelectorAll("span[data-m]");

  /* ---------------- 卡片 ---------------- */
  function build(t){
    var el = document.createElement("article");
    el.className = "tk";
    el.dataset.id = t.id;
    el.innerHTML =
      '<div class="tk-top">' +
        '<span class="tk-no"></span>' +
        '<span class="tk-when"></span>' +
        '<span class="tk-plus">+' + t.mins + ' ' + UNIT_LABEL + '</span>' +
      '</div>' +
      '<div class="tk-time"></div>' +
      '<div class="tk-state"></div>' +
      '<button class="tk-x" type="button">刪除</button>' +
      '<div class="tk-bar"><i></i></div>';

    el.addEventListener("click", function(ev){
      if(ev.target.closest(".tk-x")) return;
      var t2 = timers.find(function(x){ return x.id === t.id; });
      if(!t2) return;
      if(t2.status === "ringing"){
        t2.status = "pending";
        t2.pendingUntil = Date.now() + GRACE;
        unbook(t2.id);
        syncSound(); save();
      } else if(t2.status === "pending"){
        t2.status = "ringing";
        t2.pendingUntil = 0;
        syncSound(); save();
      }
      tick();
    });

    el.querySelector(".tk-x").addEventListener("click", function(ev){
      ev.stopPropagation();
      if(armed === t.id){ remove(t.id); armed = null; return; }
      armed = t.id; armedAt = Date.now(); tick();
    });

    return el;
  }

  function layout(){
    timers.sort(function(a,b){ return a.endAt - b.endAt; });
    var keep = new Set();
    timers.forEach(function(t){
      keep.add(t.id);
      var el = nodes.get(t.id);
      if(!el){ el = build(t); nodes.set(t.id, el); }
      $list.appendChild(el);
    });
    nodes.forEach(function(el, id){
      if(!keep.has(id)){ el.remove(); nodes.delete(id); }
    });
    tick();
  }

  /* ---------------- 每格更新 ---------------- */
  function tick(){
    var now = Date.now();
    var d = new Date(now);

    $now.innerHTML = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) +
                     "<small>:" + pad2(d.getSeconds()) + "</small>";

    for(var i=0;i<previews.length;i++){
      var m = +previews[i].dataset.m;
      previews[i].textContent = clock(now + m*UNIT) + " 響";
    }

    if(armed && now - armedAt > 3000) armed = null;

    var changed = false, expired = [];

    timers.forEach(function(t, i){
      if(t.status === "running" && now >= t.endAt){
        t.status = "ringing"; changed = true;
        notifyFire(t);
      }
      if(t.status === "pending" && now >= t.pendingUntil){ expired.push(t.id); return; }

      var el = nodes.get(t.id);
      if(!el) return;
      var left = t.endAt - now;

      el.className = "tk" +
        (t.status === "ringing" ? " is-ring" :
         t.status === "pending" ? " is-pending" :
         left <= SOON ? " is-soon" : "") +
        (armed === t.id ? " armed" : "");

      el.querySelector(".tk-no").textContent = i + 1;
      el.querySelector(".tk-when").innerHTML = clock(t.endAt) + "<em>響鈴</em>";

      var $t = el.querySelector(".tk-time");
      var $s = el.querySelector(".tk-state");

      if(t.status === "ringing"){
        $t.textContent = "00:00";
        var over = now - t.endAt;
        $s.textContent = over > 20000
          ? "已響 " + mmss(over) + "，點一下停止"
          : "時間到，點一下停止";
      } else if(t.status === "pending"){
        var rest = t.pendingUntil - now;
        $t.textContent = Math.ceil(rest/1000) + " 秒";
        $s.textContent = "即將移除，再點一下繼續響鈴";
        el.querySelector(".tk-bar i").style.width = Math.max(0, rest/GRACE*100) + "%";
      } else {
        $t.textContent = mmss(left);
        $s.textContent = armed === t.id ? "再按一次「刪除」確認" :
                         left <= SOON ? "快到了" : "倒數中";
      }
    });

    expired.forEach(remove);
    if(changed){ syncSound(); save(); }

    var n = timers.length;
    $empty.style.display = n ? "none" : "block";
    $bar.textContent = n ? "進行中 " + n + " 張" : "尚無倒數";
    $bar.style.display = n ? "flex" : "none";
  }

  /* ---------------- 啟動 ---------------- */
  document.getElementById("test").addEventListener("click", function(){
    audioOn().then(function(ok){ if(ok) chime(); });
    if(navigator.vibrate) navigator.vibrate(120);
  });
  document.addEventListener("pointerdown", function once(){
    audioOn(); keepAwake();
    if(timers.length) keepOn();
    document.removeEventListener("pointerdown", once);
  });

  // 說明目前這台裝置的背景限制
  (function(){
    var $w = document.getElementById("warn");
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = window.matchMedia("(display-mode: standalone)").matches ||
                     window.navigator.standalone === true;
    if(!window.isSecureContext){
      $w.innerHTML = "目前是 http 連線，<b>通知與螢幕恆亮已被瀏覽器停用</b>（響鈴正常）。<br>" +
                     "要完整測試請改用 localhost 或 HTTPS 網址。";
      $w.style.display = "block";
    } else if(ios && !standalone){
      $w.innerHTML = "iPhone 請把這頁「加到主畫面」再開啟，背景響鈴才可靠。<br>螢幕鎖上時仍可能不會響，建議讓手機插電、螢幕保持亮著。";
      $w.style.display = "block";
    } else if(!notifySupported()){
      $w.textContent = "這個瀏覽器不支援手機通知，請讓畫面保持在這一頁。";
      $w.style.display = "block";
    }
  })();

  load();
  notifyPaint();
  layout();
  syncSound();
  if(timers.length) keepOn();
  setInterval(tick, 200);
  tick();
})();
</script>
</body>
</html>
